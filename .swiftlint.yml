included:
  - Sources

disabled_rules:
  - identifier_name
  - no_extension_access_modifier
  - implicit_optional_initialization
  - no_fallthrough_only
  - notification_center_detachment
  - redundant_sendable
  - optional_data_string_conversion
  - non_optional_string_data_conversion
  - todo

line_length:
  ignores_comments: true
  warning: 130

# Comment-only lines are excluded for the same reason `line_length` ignores them:
# explaining why a public API behaves the way it does should not count against
# the file that documents it.
file_length:
  warning: 500
  error: 1000
  ignore_comment_only_lines: true

# Already excludes comments and whitespace; raised so a type that exists to
# model one protocol surface does not have to be split for the count alone.
type_body_length:
  warning: 300
  error: 400

type_name:
  max_length: 50

file_name:
  suffix_pattern: "Extensions?|\\+.*"
  excluded:
    # Extends the nested `JSONDecoder.DateDecodingStrategy`, so the type name the
    # rule looks for is qualified and can never match a file name.
    - JSONDecoder+DateDecoding.swift

force_unwrapping: error
force_try: error
force_cast: error

analyzer_rules:
  - unused_declaration
  - unused_import

opt_in_rules:
  - array_init
  - block_based_kvo
  - class_delegate_protocol
  - closing_brace
  - closure_parameter_position
  - closure_spacing
  - collection_alignment
  - colon
